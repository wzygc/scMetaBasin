[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scMetaBasin"
version = "0.2.0"
description = "Solution-landscape meta-basin consensus with optional automatic K"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "pandas>=1.4", "scipy>=1.9", "scikit-learn>=1.1", "joblib>=1.1", "threadpoolctl>=3.0"]

[project.scripts]
scmetabasin = "scmetabasin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scmetabasin = ["VERSION.json", "_vendor/skstab/LICENSE", "_vendor/skstab/SOURCE.json"]
